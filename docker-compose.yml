services:
  db:
    image: mariadb:11.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${TIMEZONE:-Asia/Taipei}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-1}
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-80.0}
      GENERATOR_CATEGORIES: ${GENERATOR_CATEGORIES:-cpu,memory,disk,network}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      BATCH_INTERVAL_SECONDS: ${BATCH_INTERVAL_SECONDS:-5}
      REALTIME_RETENTION_DAYS: ${REALTIME_RETENTION_DAYS:-30}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      RETENTION_CLEANUP_INTERVAL_HOURS: ${RETENTION_CLEANUP_INTERVAL_HOURS:-24}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-10000}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-10485760}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-user}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@example.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      SEED_VIEWER_USERNAME: ${SEED_VIEWER_USERNAME:-viewer}
      SEED_VIEWER_EMAIL: ${SEED_VIEWER_EMAIL:-viewer@example.com}
      SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD}
      TIMEZONE: ${TIMEZONE:-Asia/Taipei}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').getcode()==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      WS_BASE_URL: ${WS_BASE_URL:-ws://backend:8000}
      TIMEZONE: ${TIMEZONE:-Asia/Taipei}
    ports:
      - "8501:8501"

volumes:
  db_data:
